services:

  db:
    image: postgres:13-alpine
    container_name: myapp_db
    volumes:
      - postgres:/var/lib/postgresql/data/
    env_file:
      - ./expenses-tracking-backend/.env
    restart: unless-stopped
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: alija10/expenses_track_backend:latest
    container_name: myapp_backend
    env_file:
      - ./expenses-tracking-backend/.env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8002:8000
    entrypoint: ["/myapp/entrypoint.sh"]
    
  frontend:
    image: alija10/expenses_track_frontend:latest
    container_name: myapp_frontend
    env_file:
      - ./expenses-tracking-frontend/.env
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 5174:5173

  pgadmin:
    container_name: myapp_pgadmin
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - ./expenses-tracking-backend/.env   
    ports:
      - "5052:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin:/var/lib/pgadmin


volumes:
  pgadmin:
    external: true
  postgres:
    external: true